<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Capitão Coração 💙</title>
  <meta name="description" content="Redirecionando para a versão oficial do filme do Capitão Coração.">
  <meta http-equiv="refresh" content="1; url=versao8/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #bde9fb 0%, #7fd0f2 55%, #0a4d8c 100%);
      overflow: hidden;
    }
    .redirect-card {
      width: min(100%, 560px);
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      padding: 2rem 1.5rem;
      box-shadow: var(--sombra);
    }
    .redirect-ship {
      font-size: clamp(3.2rem, 12vw, 5.6rem);
      animation: flutua 3.5s ease-in-out infinite;
    }
    .redirect-card h1 {
      margin: .5rem 0 0;
      color: var(--azul-mar);
      font-size: clamp(2rem, 6vw, 3.2rem);
    }
    .redirect-card p {
      margin: .9rem 0 0;
      color: var(--texto);
      font-weight: 700;
    }
    .redirect-card .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-top: 1.4rem;
      text-decoration: none;
    }
    @keyframes flutua {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-14px) rotate(2deg); }
    }
  </style>
  <script>
    window.location.replace('versao8/index.html');
  </script>
</head>
<body>
  <main class="redirect-card">
    <div class="redirect-ship" aria-hidden="true">⛴️</div>
    <h1>O Capitão Coração</h1>
    <p>Redirecionando para a versão oficial do filme…</p>
    <p>Se isso não acontecer sozinho, continue pelo botão abaixo.</p>
    <a class="botao botao-cta" href="versao8/index.html">
      <span aria-hidden="true">▶</span> Começar o filme
    </a>
  </main>
</body>
</html>
