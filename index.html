<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Capitão Coração 💙 — O Filme</title>
  <meta name="description" content="O Capitão Coração: uma história animada, do mar aberto ao porto do amor.">
  <meta http-equiv="refresh" content="0; url=versao8/index.html">
  <link rel="canonical" href="versao8/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, #bde9fb 0%, #7fd0f2 55%, #0a4d8c 100%);
      overflow-x: hidden;
    }
    .abrindo { padding: 2rem 1.5rem; }
    .navio {
      font-size: clamp(3.5rem, 14vw, 7rem);
      animation: flutua 3.5s ease-in-out infinite;
    }
    @keyframes flutua {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-16px) rotate(2deg); }
    }
    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      color: #fff;
      margin: .4rem 0 0;
      text-shadow: 0 4px 0 #0a4d8c, 0 8px 20px rgba(0, 0, 0, .25);
    }
    p.sub { color: #eaf7ff; font-size: 1.15rem; font-weight: 700; margin: .5rem 0 1.8rem; }
    a.botao {
      display: inline-block;
      background: var(--coral, #ff6b6b);
      color: #fff;
      font-family: var(--fonte-titulo, "Baloo 2", cursive);
      font-size: 1.25rem;
      padding: .9rem 2.2rem;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
      transition: transform .2s ease;
    }
    a.botao:hover { transform: translateY(-3px) scale(1.04); }
    p.aviso { color: #eaf7ff; font-weight: 700; margin-top: 1.4rem; opacity: .85; }
    .ondas { position: fixed; bottom: 0; left: 0; width: 100%; line-height: 0; z-index: -1; }
    @media (prefers-reduced-motion: reduce) {
      .navio { animation: none; }
    }
  </style>
</head>
<body>
  <main class="abrindo">
    <div class="navio" aria-hidden="true">⛴️</div>
    <h1>O Capitão Coração</h1>
    <p class="sub">Abrindo o filme… 🌊</p>
    <a class="botao" href="versao8/index.html">▶ Começar o filme</a>
    <p class="aviso">Se nada acontecer, toque no botão acima.</p>
  </main>

  <div class="ondas" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none" width="100%" height="120">
      <path fill="#0a4d8c" d="M0,64 C240,120 480,0 720,48 C960,96 1200,16 1440,64 L1440,120 L0,120 Z"></path>
    </svg>
  </div>

  <script>
    // location.replace evita que o botão "voltar" fique preso neste redirecionamento
    location.replace('versao8/index.html');
  </script>
</body>
</html>
