<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=versao8/index.html">
  <title>O Capitão Coração 💙</title>
  <meta name="description" content="Uma história lúdica e cheia de amor para o nosso Capitão Coração.">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #bde9fb 0%, #7fd0f2 55%, #0a4d8c 100%);
      font-family: Nunito, sans-serif;
      color: #fff;
      text-align: center;
    }
    .navio { font-size: clamp(4rem, 14vw, 8rem); animation: flutua 3.5s ease-in-out infinite; }
    @keyframes flutua {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-18px) rotate(2deg); }
    }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: .5rem 0 .2rem; text-shadow: 0 4px 0 #0a4d8c; }
    p  { margin: 0 0 2rem; font-size: 1.1rem; opacity: .9; }
    .btn {
      display: inline-block;
      background: #e8544a;
      color: #fff;
      text-decoration: none;
      padding: .9rem 2.4rem;
      border-radius: 999px;
      font-size: 1.25rem;
      font-weight: 800;
      box-shadow: 0 6px 0 #a33;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #a33; }
  </style>
</head>
<body>
  <div class="navio">⛴️</div>
  <h1>O Capitão Coração</h1>
  <p>Redirecionando para o filme…</p>
  <a class="btn" href="versao8/index.html">▶ Começar o filme</a>
  <script>location.replace('versao8/index.html');</script>
</body>
</html>
